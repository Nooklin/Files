[versions]
# Same versions as Nooklin Photos and Nooklin Music (both build on the owner's machine), minus what Files does not use.
agp = "9.3.3"
coreKtx = "1.19.0"
lifecycleRuntimeKtx = "2.6.1"
activityCompose = "1.8.0"
kotlin = "2.2.10"
composeBom = "2026.02.01"
datastore = "1.1.1"
# Same version as Nooklin Photos (App Lock). androidx.biometric has stayed in alpha for years
biometric = "1.2.0-alpha05"
# biometric brings fragment 1.2.5, which rejects the request code of a permission launcher and crashes the app
fragment = "1.8.5"
# HttpURLConnection on Android cannot send PROPFIND, MKCOL or MOVE, OkHttp can
okhttp = "4.12.0"
# Zip files with a password (AES). java.util.zip cannot read or write them
zip4j = "2.11.5"

# FTP client (Apache 2.0)
commonsNet = "3.13.0"
# SMB2/3 client (Apache 2.0). It brings BouncyCastle, slf4j and asn-one along
smbj = "0.14.0"

# Video and music player (Apache 2.0). Playback runs in a service so music can continue in the background
media3 = "1.11.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
commons-net = { group = "commons-net", name = "commons-net", version.ref = "commonsNet" }
smbj = { group = "com.hierynomus", name = "smbj", version.ref = "smbj" }
zip4j = { group = "net.lingala.zip4j", name = "zip4j", version.ref = "zip4j" }
androidx-fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
